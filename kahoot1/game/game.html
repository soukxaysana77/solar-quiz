<!doctype html>
<html lang="th" data-i18n-title="game.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangosGo Game</title>
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main class="game-card">
    <div class="game-top">
      <div id="me" class="player-chip"></div>
      <div class="top-right">
        <span id="mode-badge" class="mode-badge" hidden></span>
        <div id="streak" class="streak" hidden></div>
      </div>
    </div>
    <p id="progress"></p>

    <!-- นั่งรอ host กดเริ่มอยู่บนหน้านี้เลย ไม่ต้องย้ายหน้าตอนคำถามมา (การโหลดหน้าใหม่กลางเกม
         กินเวลาของนาฬิกาที่เดินอยู่ ยิ่งเซิร์ฟเวอร์ช้ายิ่งเสียเวลาตอบไปฟรี ๆ) -->
    <section id="wait-view" hidden>
      <p class="eyebrow" data-i18n="common.gamePin">GAME PIN</p>
      <p id="wait-pin">------</p>
      <p id="wait-status" class="status" data-i18n="lobby.waiting">อยู่ในห้องแล้ว รอ host กดเริ่มเกม...</p>
      <p id="preload" class="preload-note"></p>
      <p id="player-count"></p>
      <ul id="players"></ul>
    </section>

    <div class="timer">
      <div id="timer-track" class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
      <p id="timer-label">--</p>
    </div>
    <img id="question-media" class="question-media" alt="Question media">
    <h1 id="question" data-i18n="game.waitingQuestion">Waiting for question...</h1>
    <div id="answers" class="answers"></div>
    <p id="message"></p>
    <a id="home" class="home-btn" href="../page/" data-i18n="common.backHome" data-i18n-stable hidden>Home</a>
  </main>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/fullscreen.js"></script>
  <script src="../shared/avatar.js"></script>
  <script src="../shared/preload.js"></script>
  <script src="game.js"></script>
</body>
</html>
