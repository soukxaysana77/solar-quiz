<!doctype html>
<html lang="th" data-i18n-title="auth.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangosGo Sign in</title>
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <div class="logo">MangosGo!</div>

    <div class="tabs" role="tablist">
      <button id="tab-login" class="tab is-on" type="button" role="tab" data-i18n="auth.tabLogin" data-i18n-stable>Sign in</button>
      <button id="tab-register" class="tab" type="button" role="tab" data-i18n="auth.tabRegister" data-i18n-stable>Sign up</button>
    </div>

    <p id="notice" class="notice"></p>

    <form id="form" novalidate>
      <div id="name-row" class="field" hidden>
        <label class="field-label" for="name" data-i18n="auth.name" data-i18n-stable>Display name</label>
        <input id="name" type="text" autocomplete="name" maxlength="60"
               data-i18n="auth.namePlaceholder" data-i18n-attr="placeholder" placeholder="Display name">
      </div>

      <div class="field">
        <label class="field-label" for="email" data-i18n="auth.email" data-i18n-stable>Email</label>
        <input id="email" type="email" autocomplete="email" maxlength="120"
               data-i18n="auth.emailPlaceholder" data-i18n-attr="placeholder" placeholder="you@example.com">
      </div>

      <div class="field">
        <label class="field-label" for="password" data-i18n="auth.password" data-i18n-stable>Password</label>
        <input id="password" type="password" autocomplete="current-password" maxlength="200"
               data-i18n="auth.passwordPlaceholder" data-i18n-attr="placeholder" placeholder="Password">
      </div>

      <div id="role-row" class="field" hidden>
        <span class="field-label" data-i18n="auth.role" data-i18n-stable>Sign up as</span>
        <div class="role-choice">
          <button type="button" class="role-btn is-on" data-role="student" data-i18n="auth.roleStudent" data-i18n-stable>Student</button>
          <button type="button" class="role-btn" data-role="teacher" data-i18n="auth.roleTeacher" data-i18n-stable>Teacher</button>
        </div>
      </div>

      <p id="error" class="auth-error" role="alert"></p>
      <button id="submit" class="submit-btn" type="submit" data-i18n="auth.submitLogin" data-i18n-stable>Sign in</button>
    </form>

    <a class="back-link" href="../page/" data-i18n="auth.backToPin" data-i18n-stable>Back to PIN entry</a>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="auth.js"></script>
</body>
</html>
