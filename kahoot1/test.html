<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibi Space Shuttle - Premium Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* พื้นหลังสีห้วงอวกาศลึก */
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* เอฟเฟกต์การ์ดและแสงเรือง */
        .stage {
            position: relative;
            width: 420px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage::before {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .shuttle-container {
            position: relative;
            width: 360px;
            height: 260px;
            z-index: 1;
            filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.5));
            animation: float 4s ease-in-out infinite;
        }

        /* แอนิเมชันลอยแบบนุ่มนวล */
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-12px) rotate(1.5deg);
            }
        }

        /* แอนิเมชันเปลวไฟพุ่งออกจากเครื่องยนต์ */
        .thruster-flame {
            animation: pulse-flame 0.15s ease-in-out infinite alternate;
            transform-origin: left center;
        }

        @keyframes pulse-flame {
            0% {
                transform: scaleX(0.85) scaleY(0.95);
                opacity: 0.8;
            }
            100% {
                transform: scaleX(1.15) scaleY(1.05);
                opacity: 1;
            }
        }

        /* ดวงดาววิบวับในพื้นหลัง */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.3;
            animation: blink 2s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- ฉากหลังดาวมินิมอล -->
    <div class="star" style="width: 3px; height: 3px; top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="star" style="width: 4px; height: 4px; top: 75%; left: 20%; animation-delay: 0.5s;"></div>
    <div class="star" style="width: 2px; height: 2px; top: 30%; left: 80%; animation-delay: 1s;"></div>
    <div class="star" style="width: 3px; height: 3px; top: 70%; left: 85%; animation-delay: 1.5s;"></div>

    <div class="stage">
        <div class="shuttle-container">
            <svg viewBox="0 0 420 280" width="100%" height="100%">
                <defs>
                    <!-- โทนสีเนียนสวย เส้นขอบสมูท -->
                    <style>
                        .outline { stroke: #0f172a; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
                        .fill-white { fill: #f8fafc; }
                        .fill-light-gray { fill: #e2e8f0; }
                        .fill-mid-gray { fill: #94a3b8; }
                        .fill-dark { fill: #1e293b; }
                        .fill-orange { fill: #f97316; }
                        .fill-red { fill: #ef4444; }
                        .fill-window { fill: #38bdf8; }
                        .fill-flame-core { fill: #fef08a; }
                        .fill-flame-outer { fill: #f97316; }
                    </style>

                    <!-- Shadow Gradient เพิ่มมิติ -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#cbd5e1"/>
                    </linearGradient>

                    <linearGradient id="tank-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#64748b"/>
                        <stop offset="100%" stop-color="#334155"/>
                    </linearGradient>
                </defs>

                <!-- 0. เปลวไฟพุ่งออกจากท่อไอเสีย -->
                <g class="thruster-flame">
                    <!-- Upper Engine Flame -->
                    <path d="M 350 115 Q 385 115 400 125 Q 385 135 350 135 Z" class="fill-flame-outer" />
                    <path d="M 350 120 Q 370 120 380 125 Q 370 130 350 130 Z" class="fill-flame-core" />
                    
                    <!-- Middle Engine Flame -->
                    <path d="M 355 152 Q 395 152 415 165 Q 395 178 355 178 Z" class="fill-flame-outer" />
                    <path d="M 355 158 Q 380 158 395 165 Q 380 172 355 172 Z" class="fill-flame-core" />

                    <!-- Lower Engine Flame -->
                    <path d="M 350 195 Q 385 195 400 205 Q 385 215 350 215 Z" class="fill-flame-outer" />
                    <path d="M 350 200 Q 370 200 380 205 Q 370 210 350 210 Z" class="fill-flame-core" />
                </g>

                <!-- 1. ถังเชื้อเพลิงสำรองใต้ท้องยาน (External Tank) -->
                <g id="tank">
                    <rect x="90" y="212" width="145" height="38" rx="14" fill="url(#tank-grad)" class="outline" />
                    <path d="M 90 212 A 19 19 0 0 0 90 250 Z" class="fill-orange outline" />
                    <!-- เข็มขัดรัดถัง -->
                    <rect x="130" y="209" width="12" height="44" rx="3" class="fill-orange outline" />
                    <rect x="185" y="209" width="12" height="44" rx="3" class="fill-orange outline" />
                </g>

                <!-- 2. ปีกด้านซ้าย/หลัง (Wing & Thermal Edge) -->
                <g id="wing">
                    <path d="M 125 175 L 325 250 L 345 250 L 345 195 L 255 110 Z" class="fill-light-gray outline" />
                    <path d="M 125 175 L 325 250 L 345 250 L 325 230 L 150 175 Z" class="fill-dark" />
                </g>

                <!-- 3. แพนหางตั้ง (Tail Fin) -->
                <g id="tail">
                    <path d="M 245 115 L 325 20 L 358 20 L 325 145 Z" fill="url(#body-grad)" class="outline" />
                    <!-- แถบสีแดงบนหาง -->
                    <path d="M 308 35 L 348 35 L 332 95 L 302 95 Z" class="fill-red" />
                    <path d="M 320 20 L 358 20 L 352 35 L 323 35 Z" class="fill-dark" />
                </g>

                <!-- 4. ตัวลำยานหลัก (Fuselage) -->
                <g id="fuselage">
                    <!-- โครงสร้างลำตัวอ้วนป้อม -->
                    <path d="M 25 175 C 25 105, 115 105, 165 105 L 325 105 L 325 195 C 255 205, 105 205, 25 175 Z" fill="url(#body-grad)" class="outline" />
                    
                    <!-- จมูกสีดำ (Nose Cone) -->
                    <path d="M 25 175 C 25 142, 58 136, 64 136 C 64 180, 48 196, 25 175 Z" class="fill-dark" />
                    
                    <!-- ท้องยานสีดำป้องกันความร้อน -->
                    <path d="M 25 175 C 48 196, 125 214, 255 200 L 325 200 L 325 186 C 205 190, 65 175, 25 175 Z" class="fill-dark" />
                    
                    <!-- แถบสีแดงตกแต่งด้านข้าง -->
                    <path d="M 60 175 L 165 175 L 165 156 L 95 156 Z" class="fill-red" />
                    
                    <!-- เส้นพาเนลโครงสร้าง -->
                    <line x1="165" y1="105" x2="165" y2="175" stroke="#cbd5e1" stroke-width="3" />
                    <line x1="230" y1="105" x2="230" y2="175" stroke="#cbd5e1" stroke-width="3" />
                    <circle cx="180" cy="140" r="2.5" class="fill-mid-gray" />

                    <!-- กระจกหน้าต่างห้องนักบิน (Cockpit Window) -->
                    <path d="M 72 142 L 118 126 L 134 126 L 134 148 L 72 148 Z" class="fill-window outline" />
                    <line x1="98" y1="133" x2="98" y2="148" stroke="#0f172a" stroke-width="4" />
                    <line x1="118" y1="126" x2="118" y2="148" stroke="#0f172a" stroke-width="4" />
                    <!-- แสงสะท้อนกระจก -->
                    <path d="M 78 144 L 92 131 L 102 131 L 88 144 Z" fill="#ffffff" opacity="0.6" />
                </g>

                <!-- 5. เครื่องยนต์ท้ายยาน (RS-25 Main Engines) -->
                <g id="engines">
                    <!-- เครื่องยนต์บน -->
                    <rect x="325" y="110" width="30" height="26" rx="6" class="fill-dark outline" />
                    <ellipse cx="352" cy="123" rx="4" ry="9" class="fill-mid-gray" />
                    
                    <!-- เครื่องยนต์กลาง -->
                    <rect x="325" y="146" width="36" height="28" rx="6" class="fill-dark outline" />
                    <ellipse cx="358" cy="160" rx="4" ry="10" class="fill-mid-gray" />

                    <!-- เครื่องยนต์ล่าง -->
                    <rect x="325" y="182" width="30" height="26" rx="6" class="fill-dark outline" />
                    <ellipse cx="352" cy="195" rx="4" ry="9" class="fill-mid-gray" />
                </g>
            </svg>
        </div>
    </div>

</body>
</html>
