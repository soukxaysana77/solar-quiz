<!DOCTYPE html>
<html lang="th" data-i18n-title="page.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangosGo! Enter PIN</title>
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="page.css">
</head>
<body>

    <header>
        <div class="left-nav">
            <a href="../Make/make.html" class="nav-btn btn-make" data-i18n="page.make">✏️ Make</a>
            <a href="#" class="nav-btn btn-join" data-i18n="page.join">🧩 Join</a>
            <div class="tooltip" data-i18n="page.tooltip">Engaging content</div>
        </div>
    </header>

    <main>
        <div class="logo">MangosGo!</div>
        <div class="pin-card">
            <h2 data-i18n="page.pinLabel">PIN</h2>
            <form class="pin-form">
                <input type="text" class="pin-input" required autocomplete="off"
                       data-i18n="page.pinPlaceholder" data-i18n-attr="placeholder" placeholder="Enter PIN">
                <button type="submit" class="join-btn" data-i18n="page.joinBtn">Join</button>
                <p class="form-message" role="alert" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer>
        <p><span data-i18n="page.footer">Get started for FREE at</span> <a href="https://mangosgo.com" target="_blank">mangosgo.com</a></p>
        <div class="footer-links">
            <a href="#" data-i18n="page.terms">Terms</a> | <a href="#" data-i18n="page.privacy">Privacy</a> | <a href="#" data-i18n="page.cookie">Cookie notice</a>
        </div>
    </footer>

<script src="../shared/i18n.js"></script>
<script src="page.js"></script>
</body>
</html>
