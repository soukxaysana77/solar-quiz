<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Astronaut - Bold Outline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f0; /* ปรับเป็นสีสว่างเพื่อให้ขอบดำโดดเด่นขึ้น */
        }

        /* ตัวนักบินอวกาศ */
        .astronaut {
            width: 80px;
            height: 90px;
            background: #ffffff;
            border-radius: 35px 35px 25px 25px;
            position: relative;
            border: 4px solid #000000; /* เพิ่มเส้นขอบดำหนา */
            animation: float 4s ease-in-out infinite;
        }

        /* หน้ากระจกหมวก (Visor) */
        .astronaut::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 32px;
            background: #161b22;
            border-radius: 18px;
            border: 3px solid #000000; /* เพิ่มเส้นขอบดำหนา */
        }

        /* เงาสะท้อนบนหน้ากระจกหมวก */
        .astronaut::after {
            content: '';
            position: absolute;
            top: 22px;
            right: 20px;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        /* กระเป๋าเป้อวกาศ (Backpack) */
        .backpack {
            position: absolute;
            top: 18px;
            left: -12px;
            width: 12px;
            height: 50px;
            background: #ffffff;
            border: 4px solid #000000; /* เพิ่มเส้นขอบดำหนา */
            border-right: none;
            border-radius: 8px 0 0 8px;
        }

        /* แขนเล็กๆ สองข้าง */
        .arm {
            position: absolute;
            top: 40px;
            width: 16px;
            height: 28px;
            background: #ffffff;
            border: 4px solid #000000; /* เพิ่มเส้นขอบดำหนา */
            border-radius: 10px;
        }

        .arm.left {
            left: -10px;
            transform: rotate(15deg);
        }

        .arm.right {
            right: -10px;
            transform: rotate(-15deg);
        }

        /* แอนิเมชันลอยแบบสภาวะไร้น้ำหนัก */
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-12px) rotate(3deg);
            }
        }
    </style>
</head>
<body>

    <div class="astronaut">
        <!-- <div class="backpack"></div> -->
        <div class="arm left"></div>
        <div class="arm right"></div>
    </div>

</body>
</html>
